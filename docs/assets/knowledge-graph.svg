<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="444" viewBox="0 0 1280 444" role="img" aria-labelledby="title desc">
  <title id="title">Example knowledge graph structure</title>
  <desc id="desc">The Machine Learning domain contains the Classification topic, notes on decision trees, logistic regression, and random forests, and individual concepts. Gray lines show hierarchy, blue shows a wikilink, and purple shows a semantic suggestion.</desc>
  <defs>
    <style>text{font-family:Segoe UI,Arial,sans-serif}.heading{fill:#f1f5f9;font-size:25px;font-weight:700}.label{fill:#e8eef9;font-size:17px;font-weight:600}.small{fill:#a8b6cc;font-size:13px}.eyebrow{font-size:11px;font-weight:700;letter-spacing:1.5px}.hierarchy{fill:none;stroke:#53647f;stroke-width:2}</style>
  </defs>
  <rect width="1280" height="444" rx="24" fill="#0e1728"/>
  <rect x="1" y="1" width="1278" height="442" rx="23" fill="none" stroke="#26334a"/>
  <text x="40" y="48" class="heading">See how your materials connect</text>
  <text x="40" y="76" class="small">Example structure · from a domain to an individual concept</text>
  <path d="M278 226H338 M548 226H578V171H638 M578 226V303H638 M578 303V365H958V335H978 M858 171H918V142H978 M918 171V240H978" class="hierarchy"/>
  <path d="M749 212V260" fill="none" stroke="#38bdf8" stroke-width="2.5"/>
  <path d="M858 185C908 185 910 215 910 257V310Q910 335 948 335H978" fill="none" stroke="#b49aff" stroke-width="2.5" stroke-dasharray="7 6"/>
  <g fill="#17263c" stroke="#3d5578"><rect x="48" y="184" width="230" height="84" rx="14"/><rect x="338" y="184" width="210" height="84" rx="14"/></g>
  <text x="68" y="210" class="eyebrow" fill="#94b5e9">DOMAIN / FOLDER</text><text x="68" y="240" class="label">Machine Learning</text>
  <text x="358" y="210" class="eyebrow" fill="#94b5e9">TOPIC / TAG</text><text x="358" y="240" class="label">Classification</text>
  <g fill="#123044" stroke="#32617a"><rect x="638" y="129" width="220" height="84" rx="14"/><rect x="638" y="261" width="220" height="84" rx="14"/></g>
  <text x="658" y="155" class="eyebrow" fill="#62d7f7">NOTE</text><text x="658" y="185" class="label">Decision trees</text>
  <text x="658" y="287" class="eyebrow" fill="#62d7f7">NOTE</text><text x="658" y="317" class="label">Logistic regression</text>
  <g fill="#25304a" stroke="#59648e"><rect x="978" y="104" width="250" height="76" rx="14"/><rect x="978" y="202" width="250" height="76" rx="14"/></g>
  <text x="998" y="130" class="eyebrow" fill="#c2c9f4">CONCEPT / SECTION</text><text x="998" y="157" class="label">Choosing a split</text>
  <text x="998" y="228" class="eyebrow" fill="#c2c9f4">CONCEPT / SECTION</text><text x="998" y="255" class="label">Overfitting</text>
  <rect x="978" y="300" width="250" height="70" rx="14" fill="#123044" stroke="#32617a"/>
  <text x="998" y="325" class="eyebrow" fill="#62d7f7">NOTE</text><text x="998" y="352" class="label">Random forests</text>
  <rect x="40" y="383" width="1200" height="1" fill="#26334a"/>
  <path d="M48 412H88" class="hierarchy"/><text x="101" y="417" class="small">Hierarchy</text>
  <path d="M279 412H319" stroke="#38bdf8" stroke-width="2.5"/><text x="332" y="417" class="small">Explicit wikilink</text>
  <path d="M547 412H587" stroke="#b49aff" stroke-width="2.5" stroke-dasharray="7 6"/><text x="600" y="417" class="small">Semantic suggestion between notes</text>
</svg>
